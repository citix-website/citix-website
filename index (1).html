<script id="citix-core">
(function () {
  'use strict';
  const { store, products } = window.CITIX_CONFIG;
  const e = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clean = value => String(value ?? '').replace(/[\u0000-\u001f\u007f]+/g, ' ').trim();
  const money = paise => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: paise % 100 ? 2 : 0 }).format(paise / 100);
  const pricePaise = v => typeof v.price === 'number' && Number.isFinite(v.price) && v.price >= 0 ? Math.round(v.price * 100) : null;
  const stockLimit = v => v.stock === null || v.stock === undefined ? store.maxQuantityPerVariant : Number.isInteger(v.stock) && v.stock >= 0 ? Math.min(v.stock, store.maxQuantityPerVariant) : 0;
  const variantKey = (p, v) => p.id + ':' + v.size;
  function resolveItem(key) {
    for (const product of products) {
      const variant = product.variants.find(v => variantKey(product, v) === key);
      if (variant) return { product, variant };
    }
    return null;
  }
  function normaliseLines(value) {
    if (!Array.isArray(value)) return [];
    const merged = new Map();
    for (const item of value) {
      const found = resolveItem(item?.key);
      if (!found) continue;
      const quantity = Math.max(0, Math.trunc(Number(item.quantity) || 0));
      if (!quantity) continue;
      merged.set(item.key, Math.min(stockLimit(found.variant), (merged.get(item.key) || 0) + quantity));
    }
    return [...merged].filter(([, quantity]) => quantity > 0).map(([key, quantity]) => ({ key, quantity }));
  }
  function linesFor(value) {
    return normaliseLines(value).map(item => {
      const found = resolveItem(item.key), unitPrice = pricePaise(found.variant);
      return { ...item, ...found, unitPrice, lineTotal: unitPrice === null ? null : unitPrice * item.quantity };
    });
  }
  function totals(value) {
    const lines = linesFor(value);
    return { count: lines.reduce((n, x) => n + x.quantity, 0), knownSubtotal: lines.reduce((n, x) => n + (x.lineTotal || 0), 0), unknownPrices: lines.some(x => x.unitPrice === null) };
  }
  function mobile(value) {
    let digits = String(value || '').replace(/\D/g, '');
    if (digits.length === 12 && digits.startsWith('91')) digits = digits.slice(2);
    return /^[6-9]\d{9}$/.test(digits) ? digits : '';
  }
  function customerErrors(c) {
    const errors = {};
    if (clean(c.name).length < 2 || clean(c.name).length > 80) errors.name = 'Enter your full name (2–80 characters).';
    if (!mobile(c.phone)) errors.phone = 'Enter a valid 10-digit Indian mobile number.';
    if (clean(c.line1).length < 5 || clean(c.line1).length > 180) errors.line1 = 'Add your house/building and street address (5–180 characters).';
    if (clean(c.line2).length > 140) errors.line2 = 'Keep address line 2 within 140 characters.';
    if (clean(c.city).length < 2 || clean(c.city).length > 80) errors.city = 'Enter your town or city.';
    if (clean(c.state).length < 2 || clean(c.state).length > 80) errors.state = 'Select your state or union territory.';
    if (!/^[1-9]\d{5}$/.test(clean(c.pincode))) errors.pincode = 'Enter a valid six-digit PIN code.';
    if (clean(c.email) && (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean(c.email)) || clean(c.email).length > 120)) errors.email = 'Enter a valid email address or leave it blank.';
    if (clean(c.note).length > 200) errors.note = 'Keep your note within 200 characters.';
    if (clean(c.giftMessage).length > 200) errors.giftMessage = 'Keep your gift message within 200 characters.';
    return errors;
  }
  function makeReference(now = new Date()) {
    const date = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now).replace(/-/g, '');
    const bytes = new Uint8Array(4);
    if (window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    return 'CTX-' + date + '-' + Array.from(bytes, x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  function buildOrderMessage({ reference, createdAt, items, customer, gift = false }) {
    const errors = customerErrors(customer);
    if (Object.keys(errors).length) throw new Error('Please complete the delivery details.');
    const lines = linesFor(items);
    if (!lines.length) throw new Error('Choose at least one available item.');
    const t = totals(items);
    const date = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' }).format(new Date(createdAt));
    const text = ['*CITIX WEBSITE ORDER REQUEST*', 'Reference: ' + clean(reference), 'Prepared: ' + date + ' IST', '', '*ITEMS*'];
    lines.forEach((line, i) => {
      text.push((i + 1) + '. ' + clean(line.product.name), 'Colour: ' + clean(line.product.colour), 'Size: ' + clean(line.variant.size), 'SKU: ' + clean(line.variant.sku), 'Quantity: ' + line.quantity,
        'Unit price: ' + (line.unitPrice === null ? 'Please confirm' : money(line.unitPrice)),
        'Item total: ' + (line.lineTotal === null ? 'Please confirm' : money(line.lineTotal)), '');
    });
    text.push('Total units: ' + t.count);
    if (t.unknownPrices) {
      if (t.knownSubtotal > 0) text.push('Priced items subtotal: ' + money(t.knownSubtotal));
      text.push('Final items subtotal: Please confirm all prices');
    } else text.push('Items subtotal: ' + money(t.knownSubtotal));
    text.push('Shipping, taxes and final payable total: Please confirm', '', '*CUSTOMER & DELIVERY*', 'Name: ' + clean(customer.name), 'Mobile: +91 ' + mobile(customer.phone));
    if (clean(customer.email)) text.push('Email: ' + clean(customer.email));
    text.push('Address: ' + clean(customer.line1));
    if (clean(customer.line2)) text.push(clean(customer.line2));
    text.push(clean(customer.city) + ', ' + clean(customer.state) + ' - ' + clean(customer.pincode), 'Country: India');
    if (gift) { text.push('', 'Gift order: Yes'); if (clean(customer.giftMessage)) text.push('Gift message: ' + clean(customer.giftMessage)); }
    if (clean(customer.note)) text.push('', 'Customer note: ' + clean(customer.note));
    text.push('', 'Please confirm stock, measurements, total amount, payment method and dispatch estimate.', 'This is an order request. Confirmation and payment are pending.', 'Source: ' + store.domain);
    return text.join('\n');
  }
  function whatsappUrl(message) {
    if (!/^[1-9]\d{7,14}$/.test(store.whatsapp)) throw new Error('Check the store WhatsApp number.');
    return 'https://wa.me/' + store.whatsapp + '?text=' + encodeURIComponent(String(message));
  }
  function safeImage(value) {
    if (typeof value !== 'string' || !value.trim()) return '';
    const v = value.trim();
    if (/^https:\/\//i.test(v)) return v;
    if (!/^\/?\/?[a-z]+:/i.test(v) && !v.startsWith('//') && !/[<>"'\u0000-\u001f]/.test(v) && /\.(png|jpe?g|webp|avif|gif|svg)(\?[^#]*)?$/i.test(v)) return v;
    return '';
  }
  window.CITIX_CORE = { e, clean, money, pricePaise, stockLimit, variantKey, resolveItem, normaliseLines, linesFor, totals, mobile, customerErrors, makeReference, buildOrderMessage, whatsappUrl, safeImage };
})();
</script>

<script id="citix-assets">

(function () {
  'use strict';
  const encoder = new TextEncoder();

    const json = JSON.stringify(config, null, 2).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');

      dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x800, true); dv.setUint16(12, 33, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true); dv.setUint16(26, name.length, true); header.set(name, 30);

      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x800, true); cv.setUint16(14, 33, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, name.length, true); cv.setUint32(38, path.endsWith('/') ? 16 : 0, true); cv.setUint32(42, offset, true); record.set(name, 46);

    if (path === '/faq') return crumb('Common questions') + '<section class="wrap content-page">' + pageTitle('A little help, right here.', 'Choosing your fit, placing your request and talking to CITIX.') + '<div class="faq">' + FAQ.map(([q, a]) => '<details><summary>' + e(q) + '</summary><p>' + e(a) + '</p></details>').join('') + '</div><p class="spacer-top">' + waLink('Hi CITIX, I have a question about ordering a petticoat.', 'Ask CITIX on WhatsApp') + '</p></section>';
    if (path === '/contact') return crumb('Contact CITIX') + '<section class="wrap content-page">' + pageTitle('Let’s find your everyday fit.', 'A question about a shade, size or order? We’re a WhatsApp message away.') + '<div class="contact-card"><span class="contact-symbol">' + icon('whatsapp') + '</span><h2>Talk to CITIX.</h2><p class="contact-number">' + e(STORE.displayPhone) + '</p><p>For an existing request, include the reference shown on your review page.</p>' + waLink('Hi CITIX, I would like help with a cotton petticoat order.', 'Start a WhatsApp chat') + '<a class="text-link spacer-top" href="tel:+' + e(STORE.whatsapp) + '">' + icon('phone') + 'Call CITIX</a></div></section>';
    if (path === '/size-guide') return crumb('Size guide') + '<section class="wrap content-page">' + pageTitle('A fit that feels like you.', 'Start with your measurements, then choose your CITIX size.') + '<div class="measure-grid"><div><span>01</span><h3>Your waist</h3><p>Measure around the point where you plan to tie the drawstring.</p></div><div><span>02</span><h3>Your length</h3><p>Measure from that point down to your preferred petticoat hem.</p></div><div><span>03</span><h3>Your fit</h3><p>Confirm the garment measurements with CITIX before choosing.</p></div></div><div class="table-scroll"><table><thead><tr><th>SIZE</th><th>WAIST RANGE (CM)</th><th>HIP / WIDTH (CM)</th><th>LENGTH (CM)</th></tr></thead><tbody>' + STORE.sizeGuide.map(s => '<tr><td>' + e(s.size) + '</td><td>' + e(s.waist || 'Confirm in chat') + '</td><td>' + e(s.hip || 'Confirm in chat') + '</td><td>' + e(s.length || 'Confirm in chat') + '</td></tr>').join('') + '</tbody></table></div><p class="spacer-top">Cotton fabric does not stretch. A drawstring adjusts the waistband; it does not replace checking the hip and length measurements.</p>' + waLink('Hi CITIX, please share the confirmed waist, hip and garment length measurements for Regular and Jumbo cotton petticoats.', 'Help me choose my size') + '</section>';
    if (path === '/how-to-order') return crumb('How to order') + '<section class="wrap content-page">' + pageTitle('From a colour to a conversation.', 'A simple way to choose your cotton essentials and place a request.') + '<div class="how-steps">' + [['01', 'Choose your essential', 'Open a product, choose your colour and size, and select the quantity.'], ['02', 'Build your bag', 'Use Add to Bag for several items, or Buy Now for the item you are viewing.'], ['03', 'Add your delivery details', 'Enter your name, mobile number, full address and any optional gift note.'], ['04', 'Review and send', 'Check the request, continue to WhatsApp and press Send in the chat.'], ['05', 'Confirm with CITIX', 'Agree availability, measurements, final charges, payment and dispatch details before the order is accepted.']].map(([n, title, text]) => '<article><span>' + n + '</span><div><h3>' + title + '</h3><p>' + text + '</p></div></article>').join('') + '</div>' + button('/shop', 'Find your colour') + '</section>';
    const pages = {
      '/about': ['The quiet essential.', 'Cotton. Comfort. CITIX.', '<h2>The layer beneath, thoughtfully chosen.</h2><p>CITIX focuses on cotton petticoats for your saree wardrobe: adjustable drawstring waists, non-stretch cotton and Regular or Jumbo size options.</p><h2>A more personal way to order.</h2><p>Choose your colour online, share your delivery details and talk directly with CITIX on WhatsApp. We confirm the fit, availability and order details with you before you commit.</p>'],
      '/shipping-returns': ['Shipping & returns.', 'Know the details before you confirm your order.', '<h2>Delivery information</h2><p>Share your city, state and PIN code with your order request. CITIX will confirm delivery eligibility, charges and an estimated dispatch time in WhatsApp before accepting your order. A website request does not reserve stock.</p><h2>Cancellations & exchanges</h2><p>Ask CITIX for the applicable cancellation, return and size-exchange conditions before payment. If you need help after sending a request, message the same number with your reference and explain the issue.</p><h2>Payment & refunds</h2><p>Payment arrangements and any refund eligibility must be agreed directly with CITIX. This website does not process a payment or initiate a refund.</p>'],
      '/privacy': ['Your details, shared by you.', 'How this WhatsApp ordering website handles information.', '<h2>Your shopping bag</h2><p>Your selected product IDs, sizes, quantities and saved colours may be stored in your browser so they remain available when you return. They are not a server-side customer account.</p><h2>Your delivery information</h2><p>The delivery form and prepared message stay in the current page’s memory. This website does not send that information to a store database. When you choose Continue to WhatsApp, your details are included in the link used to prepare your message to CITIX. WhatsApp then handles that interaction under its own terms and privacy information.</p><h2>You choose when to send</h2><p>Review your address and order details before continuing. You must press Send in WhatsApp for CITIX to receive the message. A copied message is also available on your clipboard if you choose Copy order details.</p><h2>Questions & corrections</h2><p>Contact CITIX on +91 9226494403 to ask about information you have shared in a chat or to correct your delivery details.</p>'],
      '/terms': ['Ordering with CITIX.', 'Please review these points before sending your request.', '<h2>Order requests</h2><p>Submitting details on this website prepares an order request for WhatsApp. It is not a payment receipt or proof that an order has been accepted. CITIX must confirm the product, size, stock, final charges and delivery arrangements in chat.</p><h2>Product information</h2><p>Illustrations are used until actual product photographs are added. Check the real colour, garment measurements and confirmed product details with CITIX before payment. Prices not shown on the website are confirmed in chat.</p><h2>Delivery & support</h2><p>Read the shipping and returns information and request the applicable commercial terms before agreeing to an order. Contact +91 9226494403 for order help.</p>']
    };
    const page = pages[path]; if (!page) return notFound();
    return crumb(page[0]) + '<section class="wrap content-page">' + pageTitle(page[0], page[1]) + page[2] + '<div class="spacer-top">' + button('/shop', 'Explore the collection') + '</div></section>';
  }
  function notFound() { return crumb('Page not found') + '<section class="wrap section">' + empty('A little off the path.', 'This page or colour could not be found.', '/shop', 'Back to the collection') + '</section>'; }
  function view() {
    const { path } = route();
    if (path === '/' || path === '/home') return home();
    if (path === '/shop' || path === '/search') return catalogue();
    if (path.startsWith('/product/')) return product(path.slice(9));
    if (path === '/cart') return cart();
    if (path === '/checkout') return checkout();
    if (path === '/review') return review();
    if (path === '/wishlist') return wishlist();
    if (path === '/assets') return window.CITIX_ASSETS.render();
    return information(path);
  }
  function render(keepScroll = false) {
    try {
      APP.innerHTML = header() + '<main id="main" tabindex="-1">' + view() + '</main>' + footer();
      const title = document.querySelector('main h1, main h2')?.textContent || 'Cotton essentials';
      document.title = title + ' | CITIX';
      if (!keepScroll) { window.scrollTo(0, 0); document.querySelector('#main')?.focus({ preventScroll: true }); }
    } catch (error) { APP.innerHTML = header() + '<main id="main"><section class="wrap section">' + empty('We couldn’t prepare that page.', 'Please return to the collection and try again.') + '</section></main>' + footer(); console.error('CITIX page error:', error.message); }
  }
  function selectedLine(id) { const p = PRODUCTS.find(p => p.id === id), v = p?.variants.find(v => v.size === S.size); return p && v && stockLimit(v) > 0 ? { key: variantKey(p, v), quantity: Math.min(S.quantity, stockLimit(v)) } : null; }
  async function copyOrder() {
    const draft = ensureDraft(); if (!draft) { toast('Add your delivery details first.'); return; }
    try { if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable'); await navigator.clipboard.writeText(draft.message); toast('Order details copied. Paste them into your WhatsApp chat with CITIX.'); }
    catch { const textarea = document.querySelector('#copy-message'); textarea.value = draft.message; document.querySelector('#copy-dialog').showModal(); textarea.focus(); textarea.select(); }
  }
  document.addEventListener('click', event => {
    if (event.target.closest('.skip-link')) { event.preventDefault(); document.querySelector('#main')?.focus(); return; }
    const internalLink = event.target.closest('a[href^="#/"]');
    if (internalLink && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey && event.button === 0) {
      event.preventDefault(); go(internalLink.getAttribute('href').slice(1)); return;
    }
    const button = event.target.closest('[data-action]'); if (!button || button.disabled) return;
    const { action, id, key } = button.dataset;
    if (action === 'menu') { S.menu = !S.menu; render(true); }
    if (action === 'open-search') { document.querySelector('#search-dialog').showModal(); document.querySelector('#dialog-q').focus(); }
    if (action === 'close-search') document.querySelector('#search-dialog').close();
    if (action === 'close-copy') document.querySelector('#copy-dialog').close();
    if (action === 'size') { S.size = button.dataset.size; S.quantity = 1; render(true); }
    if (action === 'gallery') { S.gallery = Number(button.dataset.index); render(true); }
    if (action === 'quantity') { const p = PRODUCTS.find(p => route().path === '/product/' + p.id), v = p?.variants.find(v => v.size === S.size); S.quantity = Math.max(1, Math.min(v ? stockLimit(v) : 1, S.quantity + Number(button.dataset.delta))); render(true); }
    if (action === 'add-bag') {
      const item = selectedLine(id); if (!item) return;
      const old = S.bag.find(line => line.key === item.key), found = resolveItem(item.key);
      if ((old?.quantity || 0) + item.quantity > stockLimit(found.variant)) { toast('You have reached the available quantity for this size.'); return; }
      S.bag.push(item); saveBag(); render(true); toast('Added to your shopping bag.');
    }
    if (action === 'buy-now') { const item = selectedLine(id); if (!item) return; S.buyNow = item; S.checkoutMode = 'buy-now'; invalidateDraft(); go('/checkout'); }
    if (action === 'checkout-bag') { S.checkoutMode = 'bag'; invalidateDraft(); go('/checkout'); }
    if (action === 'bag-quantity') {
      const item = S.bag.find(line => line.key === key), found = resolveItem(key); if (!item || !found) return;
      const next = item.quantity + Number(button.dataset.delta);
      if (next > stockLimit(found.variant)) { toast('You have reached the available quantity for this size.'); return; }
      item.quantity = next; saveBag(); render(true);
    }
    if (action === 'remove-bag') { S.bag = S.bag.filter(line => line.key !== key); saveBag(); render(true); }
    if (action === 'wish') { S.wishlist = S.wishlist.includes(id) ? S.wishlist.filter(x => x !== id) : [...S.wishlist, id]; saveLocal(WISH_KEY, S.wishlist); render(true); }
    if (action === 'copy-message') copyOrder();
    if (action === 'open-order') {
      if (!S.shareAllowed) return;
      const draft = ensureDraft(); if (!draft || !S.shareAllowed) return;
      S.opening = true; render(true);
      window.location.assign(whatsappUrl(draft.message));
    }
  });
  document.addEventListener('change', event => {
    const type = event.target.dataset.change;
    if (type === 'gift') { S.gift = event.target.checked; invalidateDraft(); }
    if (type === 'checkout-gift') { S.gift = event.target.checked; document.querySelector('#gift-message-wrap').hidden = !S.gift; invalidateDraft(); }
    if (type === 'share') { S.shareAllowed = event.target.checked; const button = document.querySelector('#whatsapp-checkout'); if (button) button.disabled = !S.shareAllowed; }
    if (event.target.closest('#delivery-form') && event.target.name && event.target.name !== 'gift') { S.customer[event.target.name] = event.target.value; invalidateDraft(); }
  });
  document.addEventListener('input', event => {
    if (event.target.closest('#delivery-form') && event.target.name && event.target.type !== 'checkbox') {
      S.customer[event.target.name] = event.target.value; invalidateDraft();
      event.target.removeAttribute('aria-invalid'); const error = document.getElementById('error-' + event.target.name); if (error) error.textContent = '';
    }
  });
  document.addEventListener('submit', event => {
    const form = event.target.closest('[data-form]'); if (!form) return; event.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    if (form.dataset.form === 'search') { document.querySelector('#search-dialog').close(); go('/search?q=' + encodeURIComponent(String(data.q || '').trim())); }
    if (form.dataset.form === 'filters') { const params = new URLSearchParams(Object.entries(data).filter(([, value]) => value)); go('/shop?' + params); }
    if (form.dataset.form === 'delivery') {
      S.customer = Object.fromEntries(['name', 'phone', 'email', 'line1', 'line2', 'city', 'state', 'pincode', 'note', 'giftMessage'].map(key => [key, clean(data[key])]));
      S.gift = data.gift === 'on'; const errors = customerErrors(S.customer);
      form.querySelectorAll('.field-error').forEach(el => { el.textContent = ''; });
      form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
      Object.entries(errors).forEach(([name, message]) => { const el = document.getElementById('error-' + name); if (el) el.textContent = message; form.elements[name]?.setAttribute('aria-invalid', 'true'); });
      if (Object.keys(errors).length) { form.querySelector('.form-message').textContent = 'Please check the highlighted details.'; form.elements[Object.keys(errors)[0]]?.focus(); return; }
      invalidateDraft(); if (!ensureDraft()) { toast('Please check your items and delivery details.'); return; } go('/review');
    }
  });
  document.querySelectorAll('dialog').forEach(dialog => dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); }));
  window.addEventListener('hashchange', routeChanged);
  window.addEventListener('popstate', routeChanged);
  window.addEventListener('storage', event => { if (event.key === BAG_KEY) { S.bag = normaliseLines(readSaved(BAG_KEY, [])); invalidateDraft(); render(true); } });
  window.addEventListener('pageshow', event => { if (event.persisted) { S.shareAllowed = false; render(true); } });
  window.CITIX_ASSETS.onChange = () => render(true);
  render();
})();
</script>
</body>
</html>
